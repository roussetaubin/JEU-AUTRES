name: Synchroniser les jeux

on:
  schedule:
    - cron: '17 */6 * * *'        # toutes les 6 h
  workflow_dispatch:               # bouton « Run workflow » sur GitHub
  repository_dispatch:             # déclenché tout de suite par un jeu (voir templates/notify-hub.yml)
    types: [jeu-mis-a-jour]

permissions:
  contents: write

concurrency:
  group: sync-hub
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests du script
        run: node --test tests/*.test.mjs

      - name: Synchroniser
        run: node scripts/sync.mjs
        env:
          GAMES_TOKEN: ${{ secrets.GAMES_TOKEN }}

      # « always() » : même si un jeu est en erreur, les autres sont enregistrés.
      - name: Enregistrer les changements
        if: always()
        run: |
          git config user.name "hub-jeux"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Rien à enregistrer."
          else
            git commit -m "sync : mise à jour du catalogue"
            git push
          fi
