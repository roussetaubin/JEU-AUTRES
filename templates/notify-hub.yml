# OPTIONNEL. À copier dans un repo de jeu sous .github/workflows/notify-hub.yml
# pour que le hub se mette à jour tout de suite à chaque push sur main
# (sans ça, il se met à jour toutes les 6 h).
#
# Il faut un secret HUB_TOKEN dans le repo du jeu : un jeton GitHub « fine-grained »
# limité au repo du hub, permission « Contents : Read and write ».

name: Prévenir le hub

on:
  push:
    branches: [main]

jobs:
  notifier:
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher la synchronisation du hub
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.HUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/roussetaubin/Jeu-Autres/dispatches \
            -d '{"event_type":"jeu-mis-a-jour"}'
